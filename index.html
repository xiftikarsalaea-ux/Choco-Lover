<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choco Lover – สั่งเมนูช็อกโกแลต</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#9A6738;--card:#AB7543;--ink:#3A2112;--cream:#FFE2C0;--accent:#3A2112;--line:rgba(255,226,192,.45);--sheet:#FFF3E3;--sheet-ink:#3A2112;--chip:#F1DCC3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#6E4828;--sheet:#2E1A0F;--sheet-ink:#FFE2C0;--chip:#4A2D1B;--accent:#FFE2C0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#6E4828;--sheet:#2E1A0F;--sheet-ink:#FFE2C0;--chip:#4A2D1B;--accent:#FFE2C0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--cream);font-family:'Sarabun',system-ui,sans-serif;margin:0;min-height:100vh}
.serif{font-family:'Playfair Display',Georgia,serif}
.sheet{background:var(--sheet);color:var(--sheet-ink)}
.chip{background:var(--chip);border:2px solid transparent;transition:.15s}
.chip.on{border-color:#6B3A1E;background:#6B3A1E;color:#FFE2C0}
.hide{display:none!important}
.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.35)}}
.slide-in{animation:sl .25s ease-out}
@keyframes sl{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
button:focus-visible{outline:3px solid #FFE2C0;outline-offset:2px}
</style>
</head>
<body>
<header class="sticky top-0 z-20 px-4 py-3 flex items-center justify-between" style="background:var(--bg);padding-top:calc(.75rem + env(safe-area-inset-top,0px));top:0">
  <div class="serif text-lg tracking-wide">Choco Lover</div>
  <button onclick="openCart()" class="relative rounded-full px-4 py-2 font-semibold" style="background:#3A2112;color:#FFE2C0" aria-label="เปิดตะกร้า">
    🛒 ตะกร้า <span id="badge" class="ml-1 inline-block min-w-[1.5rem] text-center rounded-full bg-[#FFE2C0] text-[#3A2112] text-sm px-1.5">0</span>
  </button>
</header>

<main id="menuView" class="max-w-5xl mx-auto px-4 pb-24">
  <div class="text-center pt-6 pb-8">
    <h1 class="serif text-4xl sm:text-6xl font-semibold" style="color:var(--cream)">Chocolate Menu</h1>
    <p class="serif italic text-lg mt-2 opacity-90">เลือกเมนูโปรดแล้วปรับแต่งได้ตามใจ</p>
  </div>
  <h2 class="serif text-2xl mb-3 border-b pb-2" style="border-color:var(--line)">เครื่องดื่ม</h2>
  <div id="drinks" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-10"></div>
  <h2 class="serif text-2xl mb-3 border-b pb-2" style="border-color:var(--line)">เค้ก</h2>
  <div id="cakes" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
</main>

<!-- Customize modal -->
<div id="modal" class="hide fixed inset-0 z-30 flex items-end sm:items-center justify-center" style="background:rgba(30,15,5,.6)" onclick="if(event.target===this)closeModal()">
  <div class="sheet slide-in w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[92vh] overflow-y-auto" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))">
    <div class="flex items-start gap-4">
      <div id="mArt" class="w-24 h-24 shrink-0 rounded-2xl overflow-hidden" style="background:#AB7543"></div>
      <div class="flex-1">
        <div id="mName" class="serif text-xl font-semibold"></div>
        <div id="mTh" class="text-sm opacity-70"></div>
        <div id="mBase" class="mt-1 font-semibold"></div>
      </div>
      <button onclick="closeModal()" class="text-2xl leading-none px-2" aria-label="ปิด">×</button>
    </div>
    <div id="mOpts" class="mt-4 space-y-4"></div>
    <div class="mt-5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="qty(-1)" class="chip w-10 h-10 rounded-full text-xl" aria-label="ลดจำนวน">−</button>
        <span id="mQty" class="w-6 text-center font-semibold text-lg">1</span>
        <button onclick="qty(1)" class="chip w-10 h-10 rounded-full text-xl" aria-label="เพิ่มจำนวน">+</button>
      </div>
      <button onclick="addToCart()" class="rounded-full px-5 py-3 font-semibold" style="background:#3A2112;color:#FFE2C0">เพิ่มลงตะกร้า · <span id="mTotal"></span> บาท</button>
    </div>
  </div>
</div>

<!-- Cart drawer -->
<div id="cart" class="hide fixed inset-0 z-40 flex justify-end" style="background:rgba(30,15,5,.6)" onclick="if(event.target===this)closeCart()">
  <div class="sheet slide-in w-full sm:max-w-md h-full flex flex-col" style="padding-top:env(safe-area-inset-top,0px)">
    <div class="flex items-center justify-between p-4 border-b" style="border-color:var(--chip)">
      <div class="serif text-xl font-semibold">ตะกร้าของคุณ</div>
      <button onclick="closeCart()" class="text-2xl leading-none px-2" aria-label="ปิด">×</button>
    </div>
    <div id="cartList" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    <div class="p-4 border-t" style="border-color:var(--chip);padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))">
      <div class="flex justify-between text-lg font-semibold mb-3"><span>รวมทั้งหมด</span><span><span id="cTotal">0</span> บาท</span></div>
      <button id="checkoutBtn" onclick="checkout()" class="w-full rounded-full py-3 font-semibold" style="background:#3A2112;color:#FFE2C0">ยืนยันการสั่งซื้อ</button>
    </div>
  </div>
</div>

<!-- Thank you -->
<div id="thanks" class="hide fixed inset-0 z-50 overflow-y-auto" style="background:var(--bg)">
  <div class="max-w-md mx-auto px-5 py-10 text-center" style="padding-top:calc(2.5rem + env(safe-area-inset-top,0px))">
    <div class="text-6xl">🍫</div>
    <h2 class="serif text-4xl font-semibold mt-3">Thank You!</h2>
    <p class="mt-2 opacity-90">ขอบคุณที่สั่งซื้อค่ะ เรากำลังเตรียมเมนูของคุณ</p>
    <div class="sheet rounded-3xl p-5 mt-6 text-left">
      <div class="flex justify-between items-baseline border-b pb-3" style="border-color:var(--chip)">
        <span class="text-sm opacity-70">หมายเลขคำสั่งซื้อ</span>
        <span id="oNo" class="serif text-2xl font-semibold"></span>
      </div>
      <div id="oList" class="py-3 space-y-2"></div>
      <div class="flex justify-between font-semibold text-lg border-t pt-3" style="border-color:var(--chip)"><span>ยอดรวม</span><span><span id="oTotal"></span> บาท</span></div>
    </div>
    <button onclick="newOrder()" class="mt-6 rounded-full px-6 py-3 font-semibold" style="background:#3A2112;color:#FFE2C0">สั่งเพิ่มอีกครั้ง</button>
  </div>
</div>

<div id="toast" class="hide fixed left-1/2 -translate-x-1/2 z-[60] rounded-full px-4 py-2 text-sm font-semibold" style="bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));background:#3A2112;color:#FFE2C0">เพิ่มลงตะกร้าแล้ว</div>

function art(m){return `<img src="${IMG[m.id]}" alt="${m.en}" class="h-full w-full object-contain">`}

function card(m){
 return `<button onclick="openModal(${m.id})" class="text-left rounded-3xl p-4 transition hover:-translate-y-1" style="background:var(--card)">
  <div class="h-40 flex justify-center items-end">${art(m)}</div>
  <div class="serif text-lg leading-tight mt-3">${m.en}</div>
  <div class="text-sm opacity-90">${m.th}</div>
  <div class="mt-2 flex items-center gap-2"><span class="flex-1 border-t" style="border-color:var(--line)"></span><span class="serif text-lg">${m.price} baht</span><span class="flex-1 border-t" style="border-color:var(--line)"></span></div>
 </button>`;
}
document.getElementById("drinks").innerHTML=MENU.filter(m=>m.type==="drink").map(card).join("");
document.getElementById("cakes").innerHTML=MENU.filter(m=>m.type==="cake").map(card).join("");

let cur=null,cart=[],lastBadge=0;
const $=id=>document.getElementById(id);

function openModal(id){
 const m=MENU.find(x=>x.id===id);
 cur={m,size:0,sweet:2,tops:[],q:1};
 $("mArt").innerHTML=art(m);$("mName").textContent=m.en;$("mTh").textContent=m.th;$("mBase").textContent=m.price+" บาท";
 $("mQty").textContent=1;renderOpts();$("modal").classList.remove("hide");
}
function closeModal(){$("modal").classList.add("hide")}
function chips(list,sel,fn,multi){
 return list.map((o,i)=>{
  const label=Array.isArray(o)?o[0]+(o[1]?` +${o[1]}`:""):o;
  const on=multi?sel.includes(i):sel===i;
  return `<button onclick="${fn}(${i})" class="chip rounded-full px-3 py-2 text-sm ${on?"on":""}">${label}</button>`;
 }).join("");
}
function renderOpts(){
 const m=cur.m,drink=m.type==="drink";
 let h="";
 if(drink)h+=`<div><div class="font-semibold mb-2">ขนาดแก้ว</div><div class="flex flex-wrap gap-2">${chips(SIZES,cur.size,"setSize")}</div></div>
 <div><div class="font-semibold mb-2">ระดับความหวาน</div><div class="flex flex-wrap gap-2">${chips(SWEET,cur.sweet,"setSweet")}</div></div>`;
 h+=`<div><div class="font-semibold mb-2">${drink?"ท็อปปิ้ง":"เพิ่มเติม"} <span class="text-sm font-normal opacity-70">(เลือกได้หลายอย่าง)</span></div><div class="flex flex-wrap gap-2">${chips(drink?TOP_D:TOP_C,cur.tops,"togTop",true)}</div></div>`;
 $("mOpts").innerHTML=h;
 $("mTotal").textContent=unit()*cur.q;
}
function unit(){
 const m=cur.m,list=m.type==="drink"?TOP_D:TOP_C;
 return m.price+(m.type==="drink"?SIZES[cur.size][1]:0)+cur.tops.reduce((s,i)=>s+list[i][1],0);
}
function setSize(i){cur.size=i;renderOpts()}
function setSweet(i){cur.sweet=i;renderOpts()}
function togTop(i){const k=cur.tops.indexOf(i);k<0?cur.tops.push(i):cur.tops.splice(k,1);renderOpts()}
function qty(d){cur.q=Math.max(1,Math.min(20,cur.q+d));$("mQty").textContent=cur.q;$("mTotal").textContent=unit()*cur.q}

function addToCart(){
 const m=cur.m,drink=m.type==="drink",list=drink?TOP_D:TOP_C;
 const opts=[];
 if(drink){opts.push("ขนาด "+SIZES[cur.size][0].split(" ")[0]);opts.push("หวาน "+SWEET[cur.sweet])}
 cur.tops.slice().sort().forEach(i=>opts.push(list[i][0]));
 const key=m.id+"|"+opts.join(",");
 const ex=cart.find(c=>c.key===key);
 if(ex)ex.q+=cur.q;else cart.push({key,m,opts,unit:unit(),q:cur.q});
 closeModal();updateBadge();toast();
}
function count(){return cart.reduce((s,c)=>s+c.q,0)}
function total(){return cart.reduce((s,c)=>s+c.q*c.unit,0)}
function updateBadge(){
 const b=$("badge");b.textContent=count();
 b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump");
}
function toast(){const t=$("toast");t.classList.remove("hide");clearTimeout(window._t);window._t=setTimeout(()=>t.classList.add("hide"),1500)}

function openCart(){renderCart();$("cart").classList.remove("hide")}
function closeCart(){$("cart").classList.add("hide")}
function renderCart(){
 const l=$("cartList");
 if(!cart.length){l.innerHTML='<div class="text-center opacity-70 py-16">ยังไม่มีสินค้าในตะกร้า<br>เลือกเมนูที่ชอบได้เลย</div>'}
 else l.innerHTML=cart.map((c,i)=>`<div class="rounded-2xl p-3 flex gap-3" style="background:var(--chip)">
  <div class="w-14 h-14 shrink-0 rounded-xl overflow-hidden" style="background:#AB7543">${art(c.m)}</div>
  <div class="flex-1 min-w-0">
   <div class="font-semibold leading-tight">${c.m.th}</div>
   <div class="text-xs opacity-70">${c.opts.join(" · ")||"ไม่มีตัวเลือกเพิ่ม"}</div>
   <div class="mt-2 flex items-center gap-2">
    <button onclick="chg(${i},-1)" class="chip w-8 h-8 rounded-full" aria-label="ลด">−</button>
    <span class="w-5 text-center">${c.q}</span>
    <button onclick="chg(${i},1)" class="chip w-8 h-8 rounded-full" aria-label="เพิ่ม">+</button>
    <button onclick="rm(${i})" class="ml-auto text-sm underline opacity-70">ลบ</button>
   </div>
  </div>
  <div class="font-semibold">${c.q*c.unit}</div></div>`).join("");
 $("cTotal").textContent=total();
 $("checkoutBtn").disabled=!cart.length;$("checkoutBtn").style.opacity=cart.length?1:.4;
}
function chg(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);renderCart();updateBadge()}
function rm(i){cart.splice(i,1);renderCart();updateBadge()}

function checkout(){
 if(!cart.length)return;
 const no="CH-"+String(Math.floor(1000+Math.random()*9000));
 $("oNo").textContent="#"+no;
 $("oList").innerHTML=cart.map(c=>`<div class="flex justify-between gap-3"><div><div class="font-semibold">${c.q} × ${c.m.th}</div><div class="text-xs opacity-70">${c.opts.join(" · ")}</div></div><div>${c.q*c.unit}</div></div>`).join("");
 $("oTotal").textContent=total();
 closeCart();$("thanks").classList.remove("hide");window.scrollTo(0,0);
}
function newOrder(){cart=[];updateBadge();$("badge").textContent=0;$("thanks").classList.add("hide")}
</script>
</body>
